services:
  image-gen-web:
    build:
      context: .
      args:
        NODE_IMAGE: ${DOCKER_NODE_IMAGE:-node:20-bookworm-slim}
    env_file:
      - .env
    environment:
      API_PORT: "8700"
      ADMIN_PORT: "8850"
      WEB_ORIGIN: ${IMAGE_GEN_WEB_ORIGIN:-http://localhost:8700}
      IMAGE_GEN_API_URL: "http://localhost:8700"
    ports:
      - "127.0.0.1:8700:8700"
      - "8850:8850"
    volumes:
      - image-gen-web-data:/app/apps/api/data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

volumes:
  image-gen-web-data:
    name: image-gen-web-data
